aid: qodo
url: https://raw.githubusercontent.com/api-evangelist/qodo/refs/heads/main/apis.yml
name: Qodo
kind: company
description: Qodo (formerly CodiumAI) is an AI code-integrity platform for automated
  code review, test generation, and code quality across the SDLC. Its developer surface
  is delivered primarily as a hosted Git app and open-source PR-Agent (Qodo Merge),
  IDE plugins (Qodo Gen), and a terminal agent runtime (Qodo Command/CLI) rather than
  a broad public HTTP API.
